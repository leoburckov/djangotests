<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Магазин{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'catalog:home' %}">Магазин</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'catalog:home' %}">Главная</a>
                <a class="nav-link" href="{% url 'catalog:product_list' %}">Все продукты</a>
                <!-- ССЫЛКА ДЛЯ БЫСТРОГО СОЗДАНИЯ ПРОДУКТА -->
                <a class="nav-link" href="{% url 'catalog:product_create' %}">Создать продукт</a>
                <a class="nav-link" href="{% url 'catalog:contacts' %}">Контакты</a>
                <a class="nav-link" href="{% url 'blog:post_list' %}">Блог</a>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
