<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Магазин{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'catalog:home' %}">
                <i class="bi bi-shop me-2"></i>Магазин
            </a>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="navbar-text me-3">
                        <i class="bi bi-person-circle me-1"></i>{{ user.email }}
                    </span>
                    <a class="nav-link" href="{% url 'users:logout' %}">
                        <i class="bi bi-box-arrow-right me-1"></i>Выйти
                    </a>
                {% else %}
                    <a class="nav-link" href="{% url 'users:login' %}">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Войти
                    </a>
                    <a class="nav-link" href="{% url 'users:register' %}">
                        <i class="bi bi-person-plus me-1"></i>Регистрация
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <!-- СООБЩЕНИЯ -->
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                <i class="bi
                    {% if message.tags == 'success' %}bi-check-circle-fill
                    {% elif message.tags == 'error' %}bi-exclamation-triangle-fill
                    {% elif message.tags == 'warning' %}bi-exclamation-triangle-fill
                    {% elif message.tags == 'info' %}bi-info-circle-fill
                    {% else %}bi-info-circle-fill{% endif %}
                me-2"></i>
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
