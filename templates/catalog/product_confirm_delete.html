{% extends 'base.html' %}

{% block title %}Удалить {{ object.name }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h2 class="mb-0">Удаление продукта</h2>
                </div>
                <div class="card-body">
                    <div class="alert alert-warning">
                        <h4 class="alert-heading">Внимание!</h4>
                        <p>Вы уверены, что хотите удалить продукт <strong>"{{ object.name }}"</strong>?</p>
                        <p class="mb-0">Это действие нельзя отменить.</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-danger">
                                Да, удалить
                            </button>
                            <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-secondary">
                                Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
